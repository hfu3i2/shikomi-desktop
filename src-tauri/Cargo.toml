[package]
name = "shikomi"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shikomi-app-v17"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
